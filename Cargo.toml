[package]
name = "ctru-rt"
version = "0.1.0"
authors = ["Philipp Joram <mail@phijor.me>"]
edition = "2021"
links = "ctru-rt"
license = "MPL-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
ctru-rt-macros = { path = "ctru-rt-macros" }
log = { version = "0.4", default-features = false, features = ["max_level_trace", "release_max_level_info"] }
lock_api = "0.4.2"
spin = { version = "0.9.3", default-features = false, features = ["lazy", "rwlock", "lock_api", "spin_mutex", "mutex"] }
num_enum = { version = "0.7.0", default-features = false, features = [] }
talc = "3.1.0"

[lib]
test = false
bench = false

[dev-dependencies]
fixedbitset = { version = "0.5.7", default-features = false }
