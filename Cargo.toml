[package]
name = "ctru-rt"
version = "0.1.0"
authors = ["Philipp Joram <mail@phijor.me>"]
edition = "2024"
links = "ctru-rt"
license = "MPL-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = "line-tables-only"

[dependencies]
ctru-rt-macros = { path = "ctru-rt-macros" }
log = { version = "0.4", default-features = false, features = ["max_level_trace", "release_max_level_debug"] }
num_enum = { version = "0.7.0", default-features = false, features = [] }
talc = "5.1.1"
utf16_lit = "2.0.2"

[lib]
test = false
bench = false

[dev-dependencies]
ctru-console = { path = "ctru-console" }

[build-dependencies]
anyhow = "1.0.104"

[workspace]
members = ["ctru-console", "ctru-rt-macros"]
